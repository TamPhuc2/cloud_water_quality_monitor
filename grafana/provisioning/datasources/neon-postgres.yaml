apiVersion: 1

datasources:
  - name: Neon PostgreSQL
    uid: neon-postgres
    type: postgres
    access: proxy
    url: ${NEON_HOST}:5432
    user: ${NEON_USER}
    database: ${NEON_DB}
    isDefault: true
    editable: true
    jsonData:
      database: ${NEON_DB}
      sslmode: ${PG_SSLMODE}
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 300
    secureJsonData:
      password: ${NEON_PASSWORD}
